<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Binance Futures Top 100 Charts</title>
<style>
:root{--bg:#12151a;--panel:#1b2028;--line:#2b323d;--tx:#e6e9ee;--mut:#8a94a3;--up:#2fc58a;--dn:#f0596b;--ac:#f0b90b}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button,input{font:inherit;color:var(--tx)}
#app{display:flex;height:100dvh}
main{flex:1;min-width:0;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;flex-wrap:wrap;gap:6px 12px;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--panel)}
#pick{background:#0f1217;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-weight:700;cursor:pointer}
#px{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
#chg{font-size:13px;font-variant-numeric:tabular-nums}
#tfs{display:flex;gap:4px;margin-left:auto}
#tfs button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer;color:var(--mut)}
#tfs button.on{background:var(--ac);border-color:var(--ac);color:#1a1400;font-weight:700}
#ohlc{padding:5px 10px;font-size:12px;color:var(--mut);min-height:26px;font-variant-numeric:tabular-nums}
#wrap{position:relative;flex:1;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#tools{position:absolute;left:8px;top:8px;display:flex;gap:4px;z-index:2}
#tools button{background:rgba(27,32,40,.85);border:1px solid var(--line);border-radius:6px;padding:4px 8px;cursor:pointer;font-size:12px;color:var(--mut)}
#tools button:active{background:var(--ac);color:#1a1400}
#px.up{color:var(--up)}#px.dn{color:var(--dn)}
#latest{position:absolute;right:70px;bottom:26px;background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
#side{position:fixed;inset:0;z-index:5;background:var(--bg);display:none;flex-direction:column}
#side.open{display:flex}
#sh{display:flex;gap:8px;padding:10px;border-bottom:1px solid var(--line)}
#q{flex:1;background:#0f1217;border:1px solid var(--line);border-radius:7px;padding:8px 10px}
#x{background:#0f1217;border:1px solid var(--line);border-radius:7px;padding:0 12px;cursor:pointer}
#list{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.r{display:grid;grid-template-columns:1fr auto 70px;gap:8px;padding:9px 12px;border-bottom:1px solid #20262f;cursor:pointer;font-variant-numeric:tabular-nums}
.r.on{background:#232a35}
.r b{font-weight:600}.r i{font-style:normal;text-align:right}.r em{font-style:normal;text-align:right}
.up{color:var(--up)}.dn{color:var(--dn)}
#tb{display:flex;gap:6px;align-items:center;padding:5px 10px;border-bottom:1px solid var(--line);overflow-x:auto;white-space:nowrap}
#tb button{background:transparent;border:1px solid var(--line);border-radius:6px;padding:4px 9px;cursor:pointer;color:var(--mut);font-size:12px;flex:none}
#tb button.on{border-color:var(--ac);background:#2a2410;color:var(--tx)}
#tb b{font-weight:700}#tb .sep{width:1px;height:18px;background:var(--line);flex:none}
#stats{display:flex;flex-wrap:wrap;gap:2px 14px;padding:5px 10px;border-bottom:1px solid var(--line);font-size:12px;font-variant-numeric:tabular-nums;color:var(--mut)}
#stats i{font-style:normal;color:var(--mut)}#stats b{font-weight:600;color:var(--tx)}#stats b.up{color:var(--up)}#stats b.dn{color:var(--dn)}
#hint{position:absolute;left:8px;bottom:26px;background:rgba(27,32,40,.92);border:1px solid var(--ac);border-radius:6px;padding:4px 9px;font-size:12px;pointer-events:none;z-index:2}
:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
@media(min-width:900px){
  #side{position:static;display:flex;width:280px;border-right:1px solid var(--line)}
  #x,#pick{display:none}
}
#mlbar{padding:5px 10px;border-bottom:1px solid var(--line);font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
#mlbar b{color:var(--tx)}#mlbar .up{color:var(--up)}#mlbar .dn{color:var(--dn)}
.mlbg{margin-left:5px;font-size:10px;padding:0 4px;border-radius:4px;background:#2a2410;border:1px solid var(--ac);color:var(--ac);font-weight:700}
#mlp{position:fixed;inset:0;z-index:9;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:10px}
#mlp[hidden]{display:none}
#mlc{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);max-height:100%;overflow:auto;padding:14px}
#mlc h3{margin:0 0 10px;font-size:16px}
#mlc .g{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
#mlc label{display:flex;flex-direction:column;font-size:11px;color:var(--mut);gap:3px}
#mlc select,#mlc button{background:#0f1217;border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer;color:var(--tx)}
#mlc button.pri{background:var(--ac);border-color:var(--ac);color:#1a1400;font-weight:700}
#mlc button:disabled{opacity:.45;cursor:default}
#mlst{font-size:12px;color:var(--mut);margin:8px 0;min-height:34px;white-space:pre-wrap}
#mlm2{font-size:12px;line-height:1.6;border-top:1px solid var(--line);padding-top:8px}
#mlm2 .w{color:var(--dn)}#mlm2 .o{color:var(--up)}
</style>
</head>
<body>
<div id="app">
  <aside id="side">
    <div id="sh"><input id="q" placeholder="Search coin" autocomplete="off"><button id="x" aria-label="Close">✕</button></div>
    <div id="list"></div>
  </aside>
  <main>
    <header id="bar">
      <button id="pick">BTCUSDT ▾</button>
      <span id="px">-</span><span id="chg"></span>
      <div id="tfs"></div>
    </header>
    <div id="ohlc">Loading...</div>
    <div id="tb">
      <button data-i="ema">EMA <b style="color:#f0b90b">20</b> <b style="color:#4da3ff">50</b> <b style="color:#b07cff">200</b></button>
      <button data-i="rsi">RSI</button>
      <button data-i="sr">S/R auto</button>
      <span class="sep"></span>
      <button data-d="h" title="Horizontal line">― Line</button>
      <button data-d="t" title="Trendline">╱ Trend</button>
      <button data-d="del" title="Selected / last line delete">🗑</button>
      <button data-d="clr">Clear</button>
      <span class="sep"></span>
      <button id="mlb">🤖 ML</button>
    </div>
    <div id="stats"></div>
    <div id="mlbar" hidden></div>
    <div id="wrap"><canvas id="cv"></canvas><div id="tools"><button data-a="tin" title="Time zoom in">↔ +</button><button data-a="tout" title="Time zoom out">↔ −</button><button data-a="pin" title="Price zoom in">↕ +</button><button data-a="pout" title="Price zoom out">↕ −</button><button data-a="auto" title="Auto price scale">Auto</button></div><button id="latest" hidden>Latest ▸</button><div id="hint" hidden></div></div>
  </main>
</div>
<div id="mlp" hidden><div id="mlc">
<h3>🤖 ML Bot — move size + direction</h3>
<div class="g">
<label>Timeframe<select id="mltf"><option value="5m">5m</option><option value="15m">15m</option><option value="1h" selected>1H</option></select></label>
<label>History<select id="mlmo"><option value="1">1 mahina</option><option value="3" selected>3 mahine</option><option value="6">6 mahine</option></select></label>
<label>Aage kitni candles<select id="mlh"><option>6</option><option selected>12</option><option>24</option></select></label>
</div>
<div class="g"><button class="pri" id="mltr">Train (top 100)</button><button id="mlsp" disabled>Stop</button><button id="mlsc">Scan abhi</button></div>
<div class="g"><button id="mldl">⬇ ml-brain.json save</button><button id="mlld">⬆ Load file</button><button id="mlfs" hidden>📁 Auto-save file</button><button id="mlcl">Band karo</button></div>
<input type="file" id="mlfi" accept=".json,application/json" hidden>
<div id="mlst">Abhi koi model nahi hai. Train dabao.</div>
<div id="mlm2"></div>
</div></div>

<script>
const $ = id => document.getElementById(id);
const REST = 'https://fapi.binance.com', WSB = 'wss://fstream.binance.com/ws/';
const UP = '#2fc58a', DN = '#f0596b', UPV = 'rgba(47,197,138,.35)', DNV = 'rgba(240,89,107,.35)';
const GRID = '#232a35', MUT = '#8a94a3';
const TFS = [['1m', '1m'], ['5m', '5m'], ['15m', '15m'], ['1h', '1H'], ['1d', '1D']];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

let sym = 'BTCUSDT', tf = '15m', candles = [], off = 0, vis = innerWidth < 600 ? 60 : 120;
let ws = null, token = 0, raf = 0, cross = null, pz = 1, pshift = 0, prevP = null;
const MS = {'1m':6e4,'5m':3e5,'15m':9e5,'1h':36e5,'1d':864e5};
const defOff = () => -Math.round(vis * 0.2);
off = defOff();
const rows = {}, ticks = {};
let ind = { ema: 1, rsi: 1, sr: 0 }, tool = null, pend = null, sel = -1, V = null, st = null, hist = { busy: false, done: false }, drawings = {};
try { const s = JSON.parse(localStorage.getItem('bn100') || '{}'); if (s.sym) sym = s.sym; if (s.tf) tf = s.tf; if (s.ind) Object.assign(ind, s.ind); } catch (e) {}
try { drawings = JSON.parse(localStorage.getItem('bn100d') || '{}'); } catch (e) {}

const cv = $('cv'), ctx = cv.getContext('2d');
const dpr = Math.min(devicePixelRatio || 1, 2);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ---------- formatting ---------- */
function dp(v) { return v >= 10 ? 3 : v >= 1 ? 4 : v >= 0.1 ? 5 : v >= 0.01 ? 6 : 8; }
function fmtP(v) {
  if (v >= 1000) return v.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  if (v >= 100) return v.toFixed(2);
  return v.toFixed(dp(v));
}
function fmtV(v) { return v >= 1e9 ? (v / 1e9).toFixed(2) + 'B' : v >= 1e6 ? (v / 1e6).toFixed(2) + 'M' : v >= 1e3 ? (v / 1e3).toFixed(2) + 'K' : v.toFixed(2); }
function fmtT(t) {
  const d = new Date(t), h = d.getHours(), m = d.getMinutes();
  if (tf === '1d' || (h === 0 && m === 0)) return d.getDate() + ' ' + MON[d.getMonth()];
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}
function fmtFull(t) {
  const d = new Date(t);
  return d.getDate() + ' ' + MON[d.getMonth()] + (tf === '1d' ? '' : ' ' + fmtT(t).replace(/^\d+ \w+$/, '00:00'));
}
function niceStep(r, t) {
  const raw = r / t, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
  return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
}

/* ---------- chart ---------- */
function schedule() { if (!raf) raf = requestAnimationFrame(draw); }

function draw() {
  raf = 0;
  const W = cv.clientWidth, H = cv.clientHeight;
  if (!W || !H) return;
  if (cv.width !== Math.round(W * dpr) || cv.height !== Math.round(H * dpr)) { cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr); }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);
  const n = candles.length;
  if (!n) return;

  off = clamp(off, -Math.floor(vis * 0.7), Math.max(0, n - 5));
  $('latest').hidden = off <= 0;
  const AX = 64, AY = 18, cw = W - AX, ch = H - AY, vh = Math.round(ch * 0.15), rh = ind.rsi ? Math.round(ch * 0.2) : 0, ph = ch - vh - rh - 6;
  const end = n - off, first = end - vis, s0 = Math.max(0, first), e1 = Math.min(end, n), bw = cw / vis;
  const tOf = i => i < n ? candles[i].t : candles[n - 1].t + (i - n + 1) * MS[tf];
  if (first < 15) loadMore();

  let mn = Infinity, mx = -Infinity, mv = 0;
  for (let i = s0; i < e1; i++) {
    const c = candles[i];
    if (c.l < mn) mn = c.l; if (c.h > mx) mx = c.h; if (c.v > mv) mv = c.v;
  }
  if (mx === mn) { mx += mx * 0.001; mn -= mn * 0.001; }
  const pad = (mx - mn) * 0.06; mn -= pad; mx += pad;
  if (pz !== 1 || pshift !== 0) { const ar = mx - mn, mid = (mn + mx) / 2 + pshift * ar, half = ar / 2 * pz; mn = mid - half; mx = mid + half; }
  const Y = p => ph - (p - mn) / (mx - mn) * ph;
  const X = i => (i - first + 0.5) * bw;
  V = { mn, mx, ph, first, bw, cw };

  ctx.font = '11px system-ui,sans-serif';
  ctx.textBaseline = 'middle';

  // horizontal grid + price labels
  const step = niceStep(mx - mn, 6), dec = Math.max(0, Math.ceil(-Math.log10(step) - 1e-9));
  ctx.strokeStyle = GRID; ctx.lineWidth = 1; ctx.beginPath();
  const ys = [];
  for (let p = Math.ceil(mn / step) * step; p < mx; p += step) {
    const y = Math.round(Y(p)) + 0.5; ctx.moveTo(0, y); ctx.lineTo(cw, y); ys.push([p, y]);
  }
  // vertical grid + time labels
  const every = Math.max(1, Math.ceil(90 / bw));
  const xs = [];
  for (let i = s0; i < end; i++) if (i % every === 0) { const x = Math.round(X(i)) + 0.5; ctx.moveTo(x, 0); ctx.lineTo(x, ch); xs.push([i, x]); }
  ctx.stroke();
  ctx.fillStyle = MUT; ctx.textAlign = 'left';
  for (const [p, y] of ys) ctx.fillText(p.toFixed(dec), cw + 6, y);
  ctx.textAlign = 'center';
  for (const [i, x] of xs) ctx.fillText(fmtT(tOf(i)), clamp(x, 20, cw - 20), ch + AY / 2 + 2);

  if (ind.sr) {
    const lc = candles[n - 1].c, lv = srLevels().filter(l => l.p > mn && l.p < mx), top = a => a.sort((x, y) => y.n - x.n).slice(0, 3);
    ctx.save(); ctx.beginPath(); ctx.rect(0, 0, cw, ph); ctx.clip(); ctx.setLineDash([6, 4]); ctx.textAlign = 'right'; ctx.font = '10px system-ui,sans-serif';
    for (const l of [...top(lv.filter(l => l.p > lc)), ...top(lv.filter(l => l.p <= lc))]) {
      const res = l.p > lc, y = Math.round(Y(l.p)) + 0.5, col = res ? DN : UP;
      ctx.strokeStyle = col; ctx.lineWidth = 1 + Math.min(l.n, 6) * 0.25; ctx.globalAlpha = 0.75;
      ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = col; ctx.fillText((res ? 'R ' : 'S ') + fmtP(l.p) + ' \u00d7' + l.n, cw - 6, y - 7);
    }
    ctx.restore();
  }
  // candles + volume
  const w = Math.max(1, Math.floor(bw * 0.7)), hw = w >> 1;
  ctx.lineWidth = 1;
  ctx.save(); ctx.beginPath(); ctx.rect(0, 0, cw, ph); ctx.clip();
  for (let i = s0; i < e1; i++) {
    const c = candles[i], x = Math.round(X(i)), up = c.c >= c.o;
    ctx.fillStyle = ctx.strokeStyle = up ? UP : DN;
    ctx.beginPath(); ctx.moveTo(x + 0.5, Y(c.h)); ctx.lineTo(x + 0.5, Y(c.l)); ctx.stroke();
    const yo = Y(c.o), yc = Y(c.c);
    ctx.fillRect(x - hw, Math.min(yo, yc), w, Math.max(1, Math.abs(yo - yc)));
  }
  if (ind.ema) for (const [len, col] of [[20, '#f0b90b'], [50, '#4da3ff'], [200, '#b07cff']]) {
    const a = ema(len); ctx.strokeStyle = col; ctx.lineWidth = 1.3; ctx.beginPath();
    for (let i = Math.max(s0, len), go = false; i < e1; i++) { const x = X(i), y = Y(a[i]); go ? ctx.lineTo(x, y) : ctx.moveTo(x, y); go = true; }
    ctx.stroke();
  }
  D().forEach((d, j) => {
    ctx.strokeStyle = j === sel ? '#fff' : d.k === 'h' ? '#4da3ff' : '#f0b90b'; ctx.lineWidth = j === sel ? 2 : 1.3;
    ctx.beginPath();
    if (d.k === 'h') { const y = Math.round(sy(d.p)) + 0.5; ctx.moveTo(0, y); ctx.lineTo(cw, y); ctx.stroke(); }
    else {
      const x1 = sx(d.t1), y1 = sy(d.p1), x2 = sx(d.t2), y2 = sy(d.p2);
      ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
      if (x2 !== x1) { ctx.setLineDash([5, 4]); ctx.beginPath(); ctx.moveTo(x2, y2); ctx.lineTo(cw, y2 + (y2 - y1) / (x2 - x1) * (cw - x2)); ctx.stroke(); ctx.setLineDash([]); }
      ctx.fillStyle = ctx.strokeStyle;
      for (const [px, py] of [[x1, y1], [x2, y2]]) { ctx.beginPath(); ctx.arc(px, py, j === sel ? 4 : 2.5, 0, 7); ctx.fill(); }
    }
  });
  ctx.restore();
  for (const d of D()) if (d.k === 'h') {
    const y = sy(d.p);
    if (y > 0 && y < ph) { ctx.fillStyle = '#1f4a7a'; ctx.fillRect(cw, y - 8, AX, 16); ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(fmtP(d.p), cw + 4, y); }
  }
  if (mv > 0) for (let i = s0; i < e1; i++) {
    const c = candles[i], x = Math.round(X(i)), h = c.v / mv * vh;
    ctx.fillStyle = c.c >= c.o ? UPV : DNV; ctx.fillRect(x - hw, ch - rh - h, w, h);
  }
  const rs = ind.rsi ? rsiArr() : null;
  if (rs) {
    const ry0 = ch - rh + 8, rhh = rh - 12, RY = v => ry0 + rhh - v / 100 * rhh;
    ctx.strokeStyle = '#3a4350'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(0, ch - rh + 0.5); ctx.lineTo(cw, ch - rh + 0.5); ctx.stroke();
    ctx.strokeStyle = GRID; ctx.setLineDash([3, 3]); ctx.beginPath();
    for (const v of [30, 70]) { const y = Math.round(RY(v)) + 0.5; ctx.moveTo(0, y); ctx.lineTo(cw, y); }
    ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = MUT; ctx.textAlign = 'left'; ctx.fillText('70', cw + 6, RY(70)); ctx.fillText('30', cw + 6, RY(30));
    ctx.strokeStyle = '#ff9f43'; ctx.lineWidth = 1.2; ctx.beginPath();
    for (let i = Math.max(s0, 14), go = false; i < e1; i++) { if (rs[i] == null) continue; const x = X(i), y = RY(rs[i]); go ? ctx.lineTo(x, y) : ctx.moveTo(x, y); go = true; }
    ctx.stroke(); ctx.lineWidth = 1;
  }

  // last price line
  const last = candles[n - 1], lcol = last.c >= last.o ? UP : DN;
  const ly = clamp(Y(last.c), 8, ph - 8);
  ctx.strokeStyle = lcol; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(0, ly); ctx.lineTo(cw, ly); ctx.stroke(); ctx.setLineDash([]);
  ctx.fillStyle = lcol; ctx.fillRect(cw, ly - 8, AX, 16);
  ctx.fillStyle = '#10131a'; ctx.textAlign = 'left'; ctx.fillText(fmtP(last.c), cw + 4, ly);
  const rem = Math.max(0, Math.floor((last.t + MS[tf] - Date.now()) / 1000)), hh = Math.floor(rem / 3600), mm = Math.floor(rem % 3600 / 60), ss = rem % 60;
  const cd = (hh ? hh + ':' : '') + (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
  ctx.fillStyle = '#3a4350'; ctx.fillRect(cw, ly + 9, AX, 14);
  ctx.fillStyle = '#fff'; ctx.fillText(cd, cw + 4, ly + 16);

  // crosshair + info
  let ci = Math.min(end, n) - 1, ic = candles[ci];
  if (cross && cross.x < cw) {
    const idx = clamp(first + Math.floor(cross.x / bw), s0, end - 1);
    ci = Math.min(idx, n - 1); ic = candles[ci];
    const cx = Math.round(X(idx)) + 0.5;
    ctx.strokeStyle = '#5b6574'; ctx.setLineDash([3, 3]); ctx.beginPath();
    ctx.moveTo(cx, 0); ctx.lineTo(cx, ch);
    if (cross.y < ph) { ctx.moveTo(0, cross.y); ctx.lineTo(cw, cross.y); }
    ctx.stroke(); ctx.setLineDash([]);
    if (cross.y < ph) {
      const p = mn + (ph - cross.y) / ph * (mx - mn);
      ctx.fillStyle = '#3a4350'; ctx.fillRect(cw, cross.y - 8, AX, 16);
      ctx.fillStyle = '#fff'; ctx.textAlign = 'left'; ctx.fillText(fmtP(p), cw + 4, cross.y);
    }
    const tl = fmtFull(tOf(idx)), tw = ctx.measureText(tl).width + 12;
    ctx.fillStyle = '#3a4350'; ctx.fillRect(clamp(cx - tw / 2, 0, cw - tw), ch + 1, tw, 16);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.fillText(tl, clamp(cx, tw / 2, cw - tw / 2), ch + 9);
  }
  if (pend) {
    const px = sx(pend.t), py = sy(pend.p);
    ctx.fillStyle = '#f0b90b'; ctx.beginPath(); ctx.arc(px, py, 4, 0, 7); ctx.fill();
    if (cross && cross.x < cw && cross.y < ph) { ctx.strokeStyle = '#f0b90b'; ctx.setLineDash([4, 3]); ctx.beginPath(); ctx.moveTo(px, py); ctx.lineTo(cross.x, cross.y); ctx.stroke(); ctx.setLineDash([]); }
  }
  if (rs) { const v = rs[ci]; ctx.fillStyle = '#ff9f43'; ctx.textAlign = 'left'; ctx.fillText('RSI 14  ' + (v == null ? '-' : v.toFixed(1)), 6, ch - rh + 14); }
  const o = $('ohlc'), pc = (ic.c - ic.o) / ic.o * 100;
  o.className = ic.c >= ic.o ? 'up' : 'dn';

    for (let j = 0; j < H; j++) { let s = b1[j]; for (let d = 0; d < D; d++) s += x[xo + d] * W1[d * H + j]; h[j] = s > 0 ? s : 0; }
    let mx = -1e9;
    for (let k = 0; k < K; k++) { let s = b2[k]; for (let j = 0; j < H; j++) s += h[j] * W2[j * K + k]; z[k] = s; if (s > mx) mx = s; }
    let t = 0; for (let k = 0; k < K; k++) { z[k] = Math.exp(z[k] - mx); t += z[k]; } for (let k = 0; k < K; k++) z[k] /= t;
  }
  function predict(b, a, I, i, bt, bi) {
    const x = new Float32Array(D), z = new Float64Array(3), h = new Float64Array(16), z2 = new Float64Array(2);
    fv(a, I, i, bt, bi, x, 0);
    for (let k = 0; k < D; k++) x[k] = Math.max(-5, Math.min(5, (x[k] - b.mean[k]) / b.std[k]));
    fwd(b.size, x, 0, h, z); fwd(b.dir, x, 0, h, z2);
    return { p: [z[0], z[1], z[2]], up: z2[1] };
  }
  return { D, ind, btcF, fv, init, fwd, predict };
};

function MLWORKER(C) {
  const { D, ind, btcF, fv, init, fwd } = C;
  onmessage = e => { try { run(e.data); } catch (x) { postMessage({ type: 'err', msg: String(x && x.message || x) }); } };
  function trainMLP(X, Y, idx, Hh, K, ep, vidx, P, name) {
    const m = init(D, Hh, K), ps = [m.W1, m.b1, m.W2, m.b2], M = ps.map(p => new Float64Array(p.length)), V = ps.map(p => new Float64Array(p.length)), G = ps.map(p => new Float64Array(p.length));
    const h = new Float64Array(Hh), z = new Float64Array(K), dh = new Float64Array(Hh), ix = Int32Array.from(idx);
    let best = 1e9, bp = null, t = 0;
    for (let e = 0; e < ep; e++) {
      for (let i = ix.length - 1; i > 0; i--) { const j = (Math.random() * (i + 1)) | 0, q = ix[i]; ix[i] = ix[j]; ix[j] = q; }
      for (let b = 0; b < ix.length; b += 256) {
        for (const g of G) g.fill(0);
        const e2 = Math.min(ix.length, b + 256);
        for (let u = b; u < e2; u++) {
          const s = ix[u], xo = s * D; fwd(m, X, xo, h, z); z[Y[s]] -= 1;
          for (let k = 0; k < K; k++) G[3][k] += z[k];
          for (let j = 0; j < Hh; j++) {
            let s2 = 0; for (let k = 0; k < K; k++) { G[2][j * K + k] += h[j] * z[k]; s2 += m.W2[j * K + k] * z[k]; }
            dh[j] = h[j] > 0 ? s2 : 0; G[1][j] += dh[j];
            if (dh[j] !== 0) for (let d = 0; d < D; d++) G[0][d * Hh + j] += X[xo + d] * dh[j];
          }
        }
        t++; const n = e2 - b, c1 = 1 - Math.pow(0.9, t), c2 = 1 - Math.pow(0.999, t);
        for (let p = 0; p < 4; p++) for (let i = 0; i < ps[p].length; i++) {
          const g = G[p][i] / n; M[p][i] = 0.9 * M[p][i] + 0.1 * g; V[p][i] = 0.999 * V[p][i] + 0.001 * g * g;
          ps[p][i] -= 0.003 * (M[p][i] / c1) / (Math.sqrt(V[p][i] / c2) + 1e-8);
        }
      }
      let L = 0; for (const s of vidx) { fwd(m, X, s * D, h, z); L -= Math.log(z[Y[s]] + 1e-9); } L /= vidx.length || 1;
      if (L < best) { best = L; bp = ps.map(p => Float64Array.from(p)); }
      P(name + ': epoch ' + (e + 1) + '/' + ep + '  val loss ' + L.toFixed(4));
    }
    ps.forEach((p, i) => p.set(bp[i])); return m;
  }
  function run(d) {
    const P = t => postMessage({ type: 'p', txt: t }), H = d.H, cs = d.coins;
    const bc = cs.find(c => c.s === 'BTCUSDT'); let bt = null, bm = null;
    for (const c of cs) c.n = c.a.length / 6;
    if (bc) { const I = ind(bc.a, bc.n); bt = btcF(bc.a, bc.n, I); bm = new Map(); for (let i = 0; i < bc.n; i++) bm.set(bc.a[i * 6], i); }
    let tot = 0; for (const c of cs) tot += Math.max(0, c.n - H - 60);
    const stride = Math.max(1, Math.ceil(tot / 400000)), cap = Math.ceil(tot / stride) + cs.length + 10;
    const X = new Float32Array(cap * D), T = new Float64Array(cap), Y = new Uint8Array(cap), DR = new Uint8Array(cap), thr = {};
    let q = 0;
    P('Features bana raha hoon...');
    for (const c of cs) {
      const a = c.a, n = c.n; if (n < H + 120) continue;
      const I = ind(a, n), last = n - H - 1, mag = new Float64Array(n), dr = new Uint8Array(n), arr = [];
      for (let i = 60; i <= last; i++) {
        const cl = a[i * 6 + 4]; let mx = -1e18, mn = 1e18;
        for (let j = i + 1; j <= i + H; j++) { if (a[j * 6 + 2] > mx) mx = a[j * 6 + 2]; if (a[j * 6 + 3] < mn) mn = a[j * 6 + 3]; }
        const u = (mx - cl) / cl, w = (cl - mn) / cl; mag[i] = Math.max(u, w); dr[i] = u >= w ? 1 : 0; arr.push(mag[i]);
      }
      arr.sort((x, y) => x - y);
      const t1 = arr[Math.floor(arr.length * 0.6)], t2 = arr[Math.floor(arr.length * 0.9)];
      thr[c.s] = [t1, t2, arr.length];
      for (let i = 60; i <= last; i += stride) {
        const bi = bm ? (bm.has(a[i * 6]) ? bm.get(a[i * 6]) : -1) : -1;
        fv(a, I, i, bt, bi, X, q * D); T[q] = a[i * 6]; Y[q] = mag[i] < t1 ? 0 : mag[i] < t2 ? 1 : 2; DR[q] = dr[i]; q++;
      }
      c.a = null;
    }
    if (q < 2000) throw new Error('Data bahut kam hai (' + q + ' samples)');
    const ts = Float64Array.from(T.subarray(0, q)).sort(), c70 = ts[Math.floor(q * 0.7)], c80 = ts[Math.floor(q * 0.8)], emb = H * d.ms;
    const tr = [], va = [], te = [];
    for (let i = 0; i < q; i++) { const t = T[i]; if (t < c70 - emb) tr.push(i); else if (t >= c70 && t < c80 - emb) va.push(i); else if (t >= c80) te.push(i); }
    if (tr.length < 1000 || te.length < 200) throw new Error('Split ke liye data kam');
    const mean = new Float64Array(D), std = new Float64Array(D);
    for (const i of tr) for (let k = 0; k < D; k++) mean[k] += X[i * D + k];
    for (let k = 0; k < D; k++) mean[k] /= tr.length;
    for (const i of tr) for (let k = 0; k < D; k++) { const v = X[i * D + k] - mean[k]; std[k] += v * v; }
    for (let k = 0; k < D; k++) std[k] = Math.sqrt(std[k] / tr.length) || 1;
    for (let i = 0; i < q; i++) for (let k = 0; k < D; k++) X[i * D + k] = Math.max(-5, Math.min(5, (X[i * D + k] - mean[k]) / std[k]));
    P('Size model train ho raha hai (' + tr.length + ' train / ' + te.length + ' test samples)...');
    const size = trainMLP(X, Y, tr, 16, 3, 14, va, P, 'Size');
    const nz = a => a.filter(i => Y[i] > 0);
    const dirM = trainMLP(X, DR, nz(tr), 8, 2, 12, nz(va), P, 'Direction');
    const h = new Float64Array(16), z = new Float64Array(3), z2 = new Float64Array(2);
    let bigTr = 0; for (const i of tr) if (Y[i] === 2) bigTr++;
    const thB = Math.min(0.5, Math.max(0.15, 2 * bigTr / tr.length));
    let ok = 0, big = 0, fl = 0, flOk = 0, cnt = [0, 0, 0];
    for (const i of te) { fwd(size, X, i * D, h, z); let b = 0; if (z[1] > z[b]) b = 1; if (z[2] > z[b]) b = 2; if (b === Y[i]) ok++; cnt[Y[i]]++; if (Y[i] === 2) big++; if (z[2] >= thB) { fl++; if (Y[i] === 2) flOk++; } }
    let dok = 0, dn = 0; for (const i of nz(te)) { fwd(dirM, X, i * D, h, z2); dn++; if ((z2[1] > 0.5 ? 1 : 0) === DR[i]) dok++; }
    const R = a => Array.from(a, v => +v.toFixed(5)), mod = m => ({ D: m.D, H: m.H, K: m.K, W1: R(m.W1), b1: R(m.b1), W2: R(m.W2), b2: R(m.b2) });
    const T2 = {}; for (const s in thr) T2[s] = [+thr[s][0].toFixed(5), +thr[s][1].toFixed(5), thr[s][2]];
    postMessage({ type: 'done', brain: {
      v: 1, tf: d.tf, H, months: d.months, at: Date.now(), mean: R(mean), std: R(std), size: mod(size), dir: mod(dirM), thr: T2, thB: +thB.toFixed(3),
      m: { tr: tr.length, te: te.length, acc: ok / te.length, base: Math.max(...cnt) / te.length, big: big / te.length, flagged: fl, prec: fl ? flOk / fl : null, rec: big ? flOk / big : null, dacc: dn ? dok / dn : null, dn, coins: Object.keys(thr).length }
    } });
  }
}

(function () {
  const sleep = ms => new Promise(r => setTimeout(r, ms)), el = id => document.getElementById(id);
  let brain = null, pred = {}, pv = 0, busy = false, stopF = false, scanning = false, lastB = 0, fh = null, shownKey = '', dirty = false, worker = null;
  const C = MLCORE(), pct = v => (v * 100).toFixed(0) + '%';
  const idb = () => new Promise((res, rej) => { const r = indexedDB.open('bn100ml', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); });
  const kvGet = async k => { try { const d = await idb(); return await new Promise(r => { const q = d.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch (e) { return null; } };
  const kvSet = async (k, v) => { try { const d = await idb(); await new Promise((r, j) => { const t = d.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = r; t.onerror = () => j(); }); } catch (e) {} };
  const status = t => { el('mlst').textContent = t; };

  function toArr(k) { const a = new Float64Array(k.length * 6); k.forEach((x, i) => { for (let j = 0; j < 6; j++) a[i * 6 + j] = +x[j]; }); return a; }
  async function getK(s, tfv, from, to) {
    const out = []; let st = from;
    while (st < to && !stopF) {
      let a = null;
      for (let t = 0; ; t++) {
        const r = await fetch(`${REST}/fapi/v1/klines?symbol=${s}&interval=${tfv}&startTime=${st}&limit=1500`).catch(() => null);
        if (r && r.ok) { a = await r.json(); break; }
        if (t > 4 || stopF) throw new Error(s + ' download fail');
        await sleep(r && (r.status === 429 || r.status === 418) ? 30000 : 2000);
      }
      if (!a.length) break;
      for (const k of a) out.push(k);
      st = a[a.length - 1][0] + 1;
      if (a.length < 1500) break;
      await sleep(250);
    }
    return out;
  }
  const closedOnly = (k, ms) => (k.length && k[k.length - 1][0] + ms > Date.now()) ? k.slice(0, -1) : k;
  const symList = () => { const l = Object.keys(rows).filter(s => s !== 'BTCUSDT'); l.unshift('BTCUSDT'); return l; };

  /* ---- train ---- */
  async function trainNow() {
    if (busy) return;
    const tfv = el('mltf').value, H = +el('mlh').value; let mo = +el('mlmo').value; const ms = MS[tfv];
    if (!Object.keys(rows).length) { status('Coin list abhi load nahi hui, thodi der baad try karo.'); return; }
    let note = ''; if (tfv === '5m' && mo > 3) { mo = 3; note = ' (5m par max 3 mahine)'; }
    busy = true; stopF = false; el('mltr').disabled = true; el('mlsp').disabled = false;
    const syms = symList(), to = Date.now(), from = to - mo * 30 * 864e5, coins = [], fail = [];
    try {
      for (let i = 0; i < syms.length && !stopF; i++) {
        status(`Download ${i + 1}/${syms.length}: ${syms[i]}${note}\n(Binance rate limit ke liye dheere chalta hai)`);
        try { const k = closedOnly(await getK(syms[i], tfv, from, to), ms); if (k.length >= H + 150) coins.push({ s: syms[i], a: toArr(k) }); else fail.push(syms[i]); }
        catch (e) { if (stopF) break; fail.push(syms[i]); }
        await sleep(120);
      }
      if (stopF) { status('Stop kiya. Kuch save nahi hua.'); return; }
      if (!coins.find(c => c.s === 'BTCUSDT')) throw new Error('BTC data nahi mila');
      if (worker) worker.terminate();
      const src = `const C=(${MLCORE})();(${MLWORKER})(C);`;
      worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
      const res = await new Promise((ok, no) => {
        worker.onmessage = e => { const d = e.data; if (d.type === 'p') status(d.txt + '\n(chart chalta rahega, page band mat karna)'); else if (d.type === 'done') ok(d.brain); else no(new Error(d.msg)); };
        worker.onerror = e => no(new Error(e.message || 'worker error'));
        worker.postMessage({ coins, H, ms, tf: tfv, months: mo }, coins.map(c => c.a.buffer));
        el('mlsp').onclick = () => { stopF = true; worker.terminate(); no(new Error('Stop kiya')); };
      });
      worker.terminate(); worker = null;
      setBrain(res); await persist();
      status(`Training poori. ${res.m.coins} coins seekhe${fail.length ? ', ' + fail.length + ' skip (data kam)' : ''}. Ab scan chal raha hai...`);
      scan();
    } catch (e) { status('Error: ' + e.message); }
    finally { busy = false; el('mltr').disabled = false; el('mlsp').disabled = true; el('mlsp').onclick = () => { stopF = true; }; }
  }

  function setBrain(b) { brain = b; pred = {}; pv++; lastB = 0; el('mltf').value = b.tf; el('mlh').value = String(b.H); if ([...el('mlmo').options].some(o => +o.value === b.months)) el('mlmo').value = String(b.months); renderM(); }
  async function persist() {
    await kvSet('brain', brain);
    if (fh) { const ok = await writeFh(); if (!ok) status(el('mlst').textContent + '\nAuto-save file ki permission dobara chahiye: "Auto-save file" button dabao.'); }
  }
  async function writeFh() {
    if (!fh || !brain) return false;
    try {
      if (await fh.queryPermission({ mode: 'readwrite' }) !== 'granted' && await fh.requestPermission({ mode: 'readwrite' }) !== 'granted') return false;
      const w = await fh.createWritable(); await w.write(JSON.stringify(brain)); await w.close(); return true;
    } catch (e) { return false; }
  }
  function renderM() {
    const m = el('mlm2'); if (!brain) { m.innerHTML = ''; return; }
    const x = brain.m, bs = x.big, good = x.acc > x.base + 0.01 || (x.prec != null && x.prec > bs * 1.3);
    m.innerHTML = `<b>Test result (naya, unseen data par)</b> — ${brain.tf}, agle ${brain.H} candles, ${brain.months} mahine, ${x.coins} coins<br>
Size accuracy: <b>${pct(x.acc)}</b> (sirf "hamesha Small" bolne se: ${pct(x.base)})<br>
Bade move ka asli base rate: <b>${pct(bs)}</b>. Model jab Big ≥ ${pct(brain.thB)} bole (${x.flagged} baar): sahi <b>${x.prec == null ? '-' : pct(x.prec)}</b>, pakda <b>${x.rec == null ? '-' : pct(x.rec)}</b> bade moves<br>
Direction accuracy (middle/big moves par): <b>${x.dacc == null ? '-' : pct(x.dacc)}</b> (50% = sikka uchhalna)<br>
<span class="${good ? 'o' : 'w'}">${good ? 'Model random se thoda behtar dikh raha hai. Phir bhi ye guarantee nahi, sirf chance hai.' : 'Is baar model random se behtar nahi dikha. Is par bharosa mat karo; zyada data ya alag timeframe try karo.'}</span><br>
Trained: ${new Date(brain.at).toLocaleString()}`;
  }

  /* ---- scan / predict ---- */
  async function scan() {
    if (!brain || scanning) return; scanning = true; const my = brain, ms = MS[my.tf];
    try {
      let bt = null, bm = null;
      for (const s of symList()) {
        if (my !== brain) break;
        const r = await fetch(`${REST}/fapi/v1/klines?symbol=${s}&interval=${my.tf}&limit=300`).catch(() => null);
        if (r && r.ok) {
          const k = closedOnly(await r.json(), ms), n = k.length;
          if (n >= 100) {
            const a = toArr(k), I = C.ind(a, n);
            if (s === 'BTCUSDT') { bt = C.btcF(a, n, I); bm = new Map(); for (let i = 0; i < n; i++) bm.set(a[i * 6], i); }
            if (my.thr[s]) { const bi = bm && bm.has(a[(n - 1) * 6]) ? bm.get(a[(n - 1) * 6]) : -1; pred[s] = C.predict(my, a, I, n - 1, bt, bi); }
          }
        } else if (r && (r.status === 429 || r.status === 418)) await sleep(30000);
        await sleep(130);
      }
      lastB = Math.floor(Date.now() / ms); pv++; dirty = true;
      if (!busy) status(`Scan poora (${Object.keys(pred).length} coins). Har naye candle par khud update hoga.`);
    } catch (e) {} finally { scanning = false; }
  }

  function show() {
    const bar = el('mlbar'), key = sym + '|' + pv + '|' + (brain ? 1 : 0);
    if (dirty && typeof rows !== 'undefined') {
      dirty = false;
      for (const s in rows) {
        const b = rows[s].el.firstElementChild; if (!b) continue;
        const old = b.querySelector('.mlbg'); if (old) old.remove();
        const p = pred[s];
        if (brain && p && p.p[2] >= brain.thB) { const sp = document.createElement('span'); sp.className = 'mlbg'; sp.textContent = '⚡' + (p.up >= 0.5 ? '↑' : '↓') + pct(p.p[2]); b.appendChild(sp); }
      }
    }
    if (key === shownKey) return; shownKey = key;
    if (!brain) { bar.hidden = true; return; }
    bar.hidden = false; const p = pred[sym], t = brain.thr[sym];
    if (!t) { bar.textContent = 'ML: is coin ka training data nahi tha.'; return; }
    if (!p) { bar.textContent = 'ML scan chal raha hai...'; return; }
    const up = p.up >= 0.5;
    bar.innerHTML = `ML ${brain.tf} · agle ${brain.H} candle: Small <b>${pct(p.p[0])}</b> · Middle <b>${pct(p.p[1])}</b> · Big <b>${pct(p.p[2])}</b> &nbsp;|&nbsp; Direction (agar move aaya): <b class="${up ? 'up' : 'dn'}">${up ? '↑ Up ' + pct(p.up) : '↓ Down ' + pct(1 - p.up)}</b> &nbsp;|&nbsp; Middle ≥ ${(t[0] * 100).toFixed(2)}%, Big ≥ ${(t[1] * 100).toFixed(2)}%${t[2] < 500 ? ' <span class="dn">(kam data, kam bharosemand)</span>' : ''}`;
  }

  /* ---- file save / load ---- */
  el('mldl').onclick = () => {
    if (!brain) { status('Pehle train karo ya file load karo.'); return; }
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(brain)], { type: 'application/json' })); a.download = 'ml-brain.json';
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 3000);
  };
  el('mlld').onclick = () => el('mlfi').click();
  el('mlfi').onchange = async e => {
    const f = e.target.files[0]; e.target.value = ''; if (!f) return;
    try {
      const b = JSON.parse(await f.text());
      if (b.v !== 1 || !b.size || !b.dir || !b.thr || !b.mean || !MS[b.tf]) throw new Error('ye ml-brain.json file sahi nahi lagti');
      setBrain(b); await persist(); status('File load ho gayi. Scan chal raha hai...'); scan();
    } catch (x) { status('Load fail: ' + x.message); }
  };
  if (window.showSaveFilePicker) {
    el('mlfs').hidden = false;
    el('mlfs').onclick = async () => {
      try {
        if (fh && brain && await writeFh()) { status('Auto-save permission ok. File update ho gayi.'); return; }
        fh = await showSaveFilePicker({ suggestedName: 'ml-brain.json', types: [{ description: 'JSON', accept: { 'application/json': ['.json'] } }] });
        await kvSet('fh', fh); if (brain) await writeFh(); status('Auto-save file set. Ab har training ke baad isi file mein save hoga.');
      } catch (e) {}
    };
  }
  el('mlsc').onclick = () => { if (!brain) status('Pehle model chahiye.'); else if (!scanning) scan(); };
  el('mltr').onclick = trainNow;
  el('mlsp').onclick = () => { stopF = true; };
  el('mlb').onclick = () => { el('mlp').hidden = false; };
  el('mlcl').onclick = () => { el('mlp').hidden = true; };
  el('mlp').onclick = e => { if (e.target === el('mlp')) el('mlp').hidden = true; };

  /* ---- start ---- */
  (async () => {
    fh = await kvGet('fh'); const b = await kvGet('brain');
    if (b && b.v === 1 && b.size && MS[b.tf]) { setBrain(b); status('Pichla seekha hua model browser se load hua.'); }
    const w = setInterval(() => { if (brain && Object.keys(rows).length) { clearInterval(w); scan(); } }, 1000);
  })();
  setInterval(() => {
    show();
    if (brain && !scanning && !busy && lastB && Math.floor((Date.now() - 4000) / MS[brain.tf]) > lastB) scan();
  }, 1000);
})();
</script>
